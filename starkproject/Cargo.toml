[package]
name = "starkproject"
version = "0.1.0"

[dependencies]
winterfell = "0.13.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.22" 
anyhow = "1.0"
bincode = "2.0.1"

[[bin]]
name = "single_credential"
path = "src/main_single_cred.rs"

[[bin]]
name = "threshold_credential"
path = "src/main_threshold.rs"

[[bin]]
name = "multi_credential"
path = "src/main_multi.rs"

[[bin]]
name = "multi_proof_size"
path = "src/main_multi_proof_size.rs"

[[bin]]
name = "multi_proof_size_fixed"
path = "src/main_multi_proof_size_fixed.rs"
